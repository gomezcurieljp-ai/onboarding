<style>
/* ARION brand (see branding/brand-identity.md): quiet running club. Bone ground, navy ink, burgundy as the only accent,
   Manrope 600 headings, Hanken Grotesk text, soft corners, no shadows. Light only, like the emails. One step per screen, fixed action bar. */
:root {
  --bg: #F3F1EC; --surface: #FFFFFF; --ink: #1C2B45; --text: #2E3135; --muted: #5E6168; --line: #E4E0D6; --line-strong: #CFC9BB;
  --accent: #6E1F2F; --accent-ink: #F3F1EC; --accent-soft: #F1E6E7; --inv: #1C2B45; --inv-ink: #F3F1EC; --warn: #9B2C2C;
  --display: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  color-scheme: only light;   /* one brand look on every phone, even in dark mode */
}
* { box-sizing: border-box }
body { background: var(--bg); color: var(--text); font: 400 16px/1.6 var(--body); -webkit-font-smoothing: antialiased }
.wrap { max-width: 620px; margin: 0 auto; padding-block: 20px 128px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* top bar */
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line) }
.mark { display: flex; align-items: center; min-width: 0; color: var(--ink) }
.mark svg { height: 44px; width: 44px; flex: none }   /* round avatar: bone horse on a navy circle, no letters */
.lang { display: flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; flex: none }
.lang button { border: 0; border-radius: 999px; background: transparent; color: var(--muted); padding: 0 13px; min-height: 34px; font: 600 13px var(--body); letter-spacing: .06em; cursor: pointer }
.lang button[aria-pressed="true"] { background: var(--inv); color: var(--inv-ink) }

/* progress */
.prog { display: flex; align-items: center; gap: 14px; margin-top: 24px; font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums }
.prog .rule { flex: 1; height: 4px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden }
.prog .rule span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); transition: width .35s cubic-bezier(.2,.8,.2,1) }

/* type */
.eyebrow { font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 }
h1, h2 { font-family: var(--display); font-weight: 600; color: var(--ink); letter-spacing: -.015em; text-wrap: balance; margin: 0; line-height: 1.12 }
h1 { font-size: clamp(2rem, 7vw, 2.75rem) }
h1 em { font-style: normal; color: var(--accent) }
.screen > header h1 em { display: block; margin-top: .15em }   /* second line of the welcome title */
h2 { font-size: clamp(1.5rem, 5vw, 1.9rem) }
.lede { color: var(--muted); margin: 0; max-width: 52ch; font-size: 17px }
.screen { display: grid; gap: 28px; margin-top: 32px }
.screen > header { display: grid; gap: 12px }

/* path cards */
.paths { display: grid; gap: 12px }
.path { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; width: 100%;
  background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); border-radius: 14px; padding: 20px; cursor: pointer; font: inherit;
  transition: border-color .15s, background .15s }
.path:hover { border-color: var(--ink) }
.path:active { background: var(--accent-soft) }
.path strong { font: 600 1.3rem/1.2 var(--display); color: var(--ink) }
.path small { grid-column: 1; color: var(--muted); font-size: 15px }
.path i { grid-row: 1 / span 2; grid-column: 2; font-style: normal; font: 600 12px var(--body); letter-spacing: .04em; border: 1px solid var(--line-strong); color: var(--muted); border-radius: 999px; padding: 4px 10px; white-space: nowrap }
.reassure { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; padding: 20px 0 0; border-top: 1px solid var(--line); margin: 0; list-style: none }
.reassure li { font-size: 14px; color: var(--muted) }
.reassure b { display: block; color: var(--ink); font: 600 15px var(--display) }
.motto { margin: 0; color: var(--muted); font-size: 14px }
.motto span { font-family: var(--display); color: var(--ink); font-weight: 600 }
.paren { font: 400 12px/1.45 var(--body); color: var(--muted); letter-spacing: 0 }   /* everything in parentheses: small but readable */
.title-gr { margin: 0 0 18px; font: 600 clamp(1.6rem, 6vw, 2rem)/1 var(--display); letter-spacing: .12em; color: var(--ink) }
.title-gr .paren { display: block; margin-top: 8px }   /* parentheses always go under the word */
.motto .paren { display: block; margin-top: 2px }

/* fields */
.q { display: grid; gap: 10px; min-width: 0; border: 0; padding: 0; margin: 0; align-content: start }
.q > legend, .q > label { font: 600 16px/1.35 var(--display); color: var(--ink); padding: 0 }
.q legend { margin-bottom: 10px }
.hint { color: var(--muted); font-size: 14px; margin-top: -4px }
.auto { margin-left: 8px; font: 600 10px var(--body); letter-spacing: .08em; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; cursor: help }
.trip { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 8px; align-items: end }
.trip label { font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: grid; gap: 4px; min-width: 0 }
.trip button { background: none; border: 0; color: var(--muted); font: 500 13px var(--body); cursor: pointer; padding: 12px 0; text-decoration: underline; text-underline-offset: 3px }
.trips { display: grid; gap: 12px }
.trips .add { justify-self: start }
@media (max-width: 520px) { .trip { grid-template-columns: 1fr 1fr } .trip label:first-child { grid-column: 1 / -1 } }
.opt { color: var(--muted); font: 500 12px var(--body); margin-left: 6px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px }
input[type=text], input[type=email], input[type=number], input[type=date], textarea {
  width: 100%; font: 400 16px var(--body); color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; }
input:hover, textarea:hover { border-color: var(--muted) }
input:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--accent-soft) }
textarea { min-height: 84px; resize: vertical }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chips.stack { flex-direction: column }
.chip { position: relative; display: block }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer }
.chip span { display: block; border: 1px solid var(--line-strong); border-radius: 999px; padding: 9px 16px; font-weight: 500; font-size: 15px; background: var(--surface); transition: background .12s, border-color .12s, color .12s }
.chips.stack .chip span { border-radius: 12px; padding: 14px 16px; font: 600 16px/1.3 var(--display); color: var(--ink) }
.chip span small { display: block; color: var(--muted); font: 400 14px/1.45 var(--body); margin-top: 3px }
.chip input:hover + span { border-color: var(--ink) }
.chip input:checked + span { background: var(--inv); border-color: var(--inv); color: var(--inv-ink) }
.chip input:checked + span small { color: inherit; opacity: .8 }
.chips.stack .chip input:checked + span { box-shadow: inset 4px 0 0 var(--accent); color: var(--inv-ink) }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px }
.chip.off span { opacity: .35; text-decoration: line-through; cursor: not-allowed }
.days .chip span { min-width: 54px; text-align: center; padding: 9px 0; font: 600 13px var(--body) }
.bad input[type], .bad textarea, .bad .chip span, .bad .checks { border-color: var(--warn) }
.msg { color: var(--warn); font: 600 14px var(--body); margin: 0 }
.msg:empty { display: none }

/* health list */
.checks { display: grid; border: 1px solid var(--line-strong); border-radius: 14px; overflow: hidden; background: var(--surface) }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 14px; align-items: start; padding: 14px 16px; border-top: 1px solid var(--line); cursor: pointer }
.check:first-child { border-top: 0 }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent) }
.check.none { background: var(--inv); color: var(--inv-ink); font: 600 16px var(--display); border-top: 0 }
.note { font-size: 15px; color: var(--muted); margin: 0; max-width: 54ch }

/* setup steps */
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px; counter-reset: s }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 14px var(--display) }
.steps li > div { min-width: 0 }
.steps li > div > b { display: block; font: 600 16px var(--display); color: var(--ink) }
.steps p b { font-weight: 600; color: var(--ink) }   /* button names stay inline in the sentence */
.steps p { margin: 2px 0 0; color: var(--muted); font-size: 15px }
.steps a, .link { color: var(--ink); font-weight: 600; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px }
code { font: 500 14px ui-monospace, Menlo, monospace; background: var(--line); border-radius: 4px; padding: 1px 6px }

/* consent */
.consent { display: grid; grid-template-columns: 22px 1fr; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; padding: 18px; cursor: pointer }
.consent input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent) }
.consent > span { display: grid; gap: 6px; min-width: 0 }
.consent b { font: 600 16px/1.35 var(--display); color: var(--ink) }
.consent small { font-size: 14px; line-height: 1.5; color: var(--muted) }

/* action bar */
.nav { position: fixed; inset: auto 0 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.nav > div { max-width: 620px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px }
.btn { border-radius: 999px; padding: 13px 26px; font: 600 16px/1 var(--display); cursor: pointer; border: 1px solid var(--ink); display: inline-block }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.primary:hover { filter: brightness(1.12) }
.btn.quiet { background: transparent; color: var(--muted); border-color: transparent; padding-inline: 4px; font-size: 15px }
.btn.line { background: transparent; color: var(--ink) }
.saved { font: 500 12px var(--body); color: var(--muted) }

/* done */
.done-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
.block { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; max-height: 140px; overflow: auto; word-break: break-all; white-space: pre-wrap; margin: 0 }
details summary { cursor: pointer; color: var(--muted); font: 500 13px var(--body) }
details[open] summary { margin-bottom: 10px }
.next { margin: 0; padding: 0; list-style: none; display: grid; gap: 16px }
.next li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start }
.next li span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 14px var(--display) }
.restart { background: none; border: 0; color: var(--muted); font: 500 13px var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; justify-self: start }

/* review mode: feedback bubble (only with ?review=1) */
.fb-btn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--inv); color: var(--inv-ink); border: 0; border-radius: 999px; padding: 11px 16px; font: 600 13px var(--body); cursor: pointer; box-shadow: 0 4px 14px rgba(28,43,69,.25) }
.fb-btn.up { bottom: calc(88px + env(safe-area-inset-bottom, 0px)) }
.fb-btn.has::after { content: " ●"; color: var(--accent) }
.fb-panel { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 7;
  width: min(380px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 10px 30px rgba(28,43,69,.18); padding: 14px; display: grid; gap: 10px }
.fb-panel.up { bottom: calc(144px + env(safe-area-inset-bottom, 0px)) }
.fb-panel p { margin: 0; font: 600 12px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent) }
.fb-panel textarea { min-height: 110px }
.fb-panel div { display: flex; gap: 10px; justify-content: flex-end }
.fb-panel .btn { padding: 10px 16px; font-size: 14px }
.review-tag { font: 600 10px var(--body); letter-spacing: .1em; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 3px 8px; margin-left: 8px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>

<script>
/* ---- Brand: ARION (branding/brand-identity.md). Name without accent. ---- */
const BRAND = "ARION";
/* Web3Forms access key (web3forms.com, free). It only lets this form email the coach; it's public by design.
   Empty = no automatic email, athletes send on WhatsApp instead. Inside claude.ai the send is blocked and falls back too. */

function el(tag, attrs = {}, kids = []) {

}

function label(q, tag, forId) {

function chipGroup(q, type, opts) {
  const box = el("div", {class: "chips" + (q.stack ? " stack" : "") + (q.type.startsWith("day") ? " days" : "")});
  const cur = st.a[q.id] || "";

  opts.forEach(([v, lab, sub]) => {
    const i = el("input", {type, name: q.id, value: v, id: `q-${q.id}-${v}`});
    if (sel.includes(v)) i.checked = true;
    box.append(el("label", {class: "chip"}, [i, el("span", {}, [document.createTextNode(lab), sub ? el("small", {text: sub}) : null])]));
  });

}
function field(q) {

  document.getElementById("prog").hidden = !inStep;
  document.getElementById("nav").hidden = !inStep;
  if (inStep) {
    document.getElementById("prog-label").textContent = `${t(T.step)} ${String(st.step + 1).padStart(2, "0")}/${String(flow.length).padStart(2, "0")}`;

  if (tm) {
    const trips = (a.trips && a.trips.length) ? a.trips : [{city: "", from: "", to: ""}];
    trips[+tm[2]] = {...trips[+tm[2]], [tm[1]]: n.value.trim()}; a.trips = trips; save(true); return;
  }
  if (n.name === "no_trips") { a.no_trips = n.checked ? "yes" : ""; save(true); keepScroll(render); return; }
  if (n.name === "parq_item") {
    a[n.value] = n.checked ? "yes" : "";
    if (n.checked) { a.parq_none = ""; const x = document.getElementById("q-parq-none"); if (x) x.checked = false; }
  } else if (n.name === "parq_none") {
    a.parq_none = n.checked ? "yes" : "";
    if (n.checked) PARQ.forEach(([k]) => { a[k] = ""; const x = document.getElementById("q-" + k); if (x) x.checked = false; });
  } else if (n.type === "checkbox" && n.name !== "consent") {
    a[n.name] = [...form.querySelectorAll(`input[name="${n.name}"]:checked`)].map(i => i.value).join(", ");
  } else if (n.name === "consent") a.consent = n.checked ? "yes" : "";
  else a[n.name] = n.type === "radio" ? n.value : n.value.trim();
  if (n.name === "run_days") {
    if (a.long_run_day && !a.run_days.includes(a.long_run_day)) a.long_run_day = "";
    if (a.quality_day && !a.run_days.includes(a.quality_day)) a.quality_day = "";
  }
  if (n.name === "long_run_day" && a.quality_day === a.long_run_day) a.quality_day = "";
  const box = n.closest("[data-q]"); if (box) box.classList.remove("bad");
  const msg = document.getElementById("msg"); if (msg) msg.textContent = "";
  if (n.type === "radio" || n.type === "checkbox") {   // conditional questions may appear or disappear
    const sc = FLOWS[st.path][st.step];
    if (sc.q.some(q => q.show)) { const y = scrollY; render(); scrollTo(0, y); }
  }
  save(true);
});

function validate() {
  const sc = FLOWS[st.path][st.step]; const a = st.a;
  let first = null, msg = t(T.required);
  for (const q of flatQ(sc)) {
    let ok = true;
    if (q.type === "parq") ok = a.parq_none === "yes" || PARQ.some(([k]) => a[k] === "yes");
    else if (q.req) ok = !!a[q.id];
    if (ok && q.type === "email" && a[q.id]) { ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(a[q.id]); if (!ok) msg = t(T.emailBad); }
    if (ok && q.type === "date" && a[q.id] && ((q.min && a[q.id] < q.min) || (q.max && a[q.id] > q.max))) { ok = false; msg = t(q.id === "birth_date" ? T.birthBad : q.id === "race_date" ? T.raceDateBad : T.dateBad); }
    if (!ok) { const b = form.querySelector(`[data-q="${q.id}"]`); if (b) b.classList.add("bad"); first = first || b; }
  }
  if (!first && flatQ(sc).some(q => q.type === "trips") && a.no_trips !== "yes") {
    const today = new Date().toISOString().slice(0, 10);
    const bad = (a.trips || []).some(x => (x.from && x.from < today) || (x.to && x.to < today) || (x.from && x.to && x.to < x.from));
    if (bad) { first = form.querySelector('[data-q="travel"]') || form.querySelector(".trips"); if (first) first.classList.add("bad"); msg = t(T.tripBad); }
  }
  if (!first && a.long_run_day && a.long_run_day === a.quality_day && flatQ(sc).some(q => q.id === "quality_day")) {
    first = form.querySelector('[data-q="quality_day"]'); first.classList.add("bad"); msg = t(T.sameDay);
  }
  if (first) { document.getElementById("msg").textContent = msg; first.scrollIntoView({block: "center", behavior: "smooth"}); const f = first.querySelector("input,textarea"); if (f) f.focus({preventScroll: true}); }
  return !first;
}
form.addEventListener("submit", e => {
  e.preventDefault();
  if (!st.path || st.done || !validate()) return;
  if (st.step < FLOWS[st.path].length - 1) { st.step++; save(); render(); scrollTo(0, 0); return; }
  st.done = true; submitAll(); scrollTo(0, 0);
});

/* ---- Automatic email (Web3Forms) ---- */
function submitAll() {
  if (!FORM_KEY) { st.sendState = "manual"; save(); render(); return; }
  st.sendState = "sending"; render();
  send().then(() => { st.sendState = "sent"; save(); render(); }, () => { st.sendState = "failed"; save(); render(); });
}
const ES_PATH = {beginner: "Principiante", runner: "Corredor"};
function fmt(q, v) {
  if (q.type === "days" || q.type === "day1") return v.split(", ").map(d => DAY_SHORT.es[DAYS.indexOf(d)]).join(", ");
  if (q.opts) return v.split(", ").map(x => { const o = q.opts.find(o => o[0] === x); return o ? o[1].es : x; }).join(", ");
  return v;
}
function tripsText(lang) {
  if (st.a.no_trips === "yes") return lang === "es" ? "Ninguno" : "None";
  return (st.a.trips || []).filter(x => x.city || x.from || x.to)
    .map(x => `${x.city || "?"} (${x.from || "?"} → ${x.to || "?"})`).join("; ");
}
function groups() {   // [[section, [[label, value], ...]], ...] in Spanish, for JP
  const out = [["Ruta", [["Ruta", ES_PATH[st.path]]]]];
  FLOWS[st.path].forEach(sc => {
    const rows = [];
    flatQ(sc).forEach(q => {
      if (q.type === "steps" || q.type === "consent") return;
      if (q.type === "parq") {
        const flagged = PARQ.filter(([k]) => st.a[k] === "yes").map(([, l]) => l.es);
        rows.push(["Cuestionario de salud", flagged.length ? "REVISAR: " + flagged.join("; ") : "Ninguna aplica"]); return;
      }
      const v = q.type === "trips" ? tripsText("es") : st.a[q.id];
      if (v) rows.push([(q.l || sc.h).es.replace(/\.$/, ""), fmt(q, v)]);
    });
    if (sc.key === "consent") rows.push(["Consentimiento", st.a.consent === "yes" ? "Aceptado" : "NO"]);
    if (rows.length) out.push([sc.eyebrow.es, rows]);
  });
  return out;
}
function summary() {   // flat rows for the email
  const rows = {};
  groups().forEach(([, rs]) => rs.forEach(([l, v]) => { rows[l] = v; }));
  rows["Salud"] = rows["Cuestionario de salud"]; delete rows["Cuestionario de salud"];
  return rows;
}
async function send() {
  const s = summary(), name = st.a.name || "Atleta";
  const subject = (REVIEW ? "[REVISIÓN] " : "") + (PILOT ? "[PILOTO] " : "") + `Nuevo atleta: ${name} · ${ES_PATH[st.path]}` + (s["Salud"].startsWith("REVISAR") ? " · REVISAR SALUD" : "") + (/[a-záéíóú]{3}/i.test(st.a.injuries_current || "") && !/^(no|ninguna?|nada)\b/i.test((st.a.injuries_current || "").trim()) ? " · LESIÓN ACTUAL" : "");
  const body = {access_key: FORM_KEY, subject, from_name: BRAND, replyto: st.a.email || "", botcheck: "",
    ...s, ...(REVIEW && fbText() ? {"Feedback de prueba": (Object.assign(FB_LABELS, st.fbLabels || {}), fbText())} : {}),
    "Código de registro": block()};
  const r = await fetch("https://api.web3forms.com/submit", {method: "POST", headers: {"Content-Type": "application/json", Accept: "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.success) throw new Error(j.message || "send failed");
}
document.getElementById("back").addEventListener("click", () => {
  if (st.step > 0) st.step--; else st.path = null;
  save(); render(); scrollTo(0, 0);
});
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { st.lang = b.dataset.lang; save(); render(); }));

/* ---- Review feedback ---- */
function fbKey() { if (!st.path) return "welcome"; if (st.done) return st.path + ":final"; return st.path + ":" + FLOWS[st.path][st.step].key; }
function fbLabel() {
  if (!st.path) return "Bienvenida";
  if (st.done) return ES_PATH[st.path] + " · Pantalla final";
  const f = FLOWS[st.path]; return `${ES_PATH[st.path]} · Paso ${st.step + 1}/${f.length} · ${f[st.step].eyebrow.es}`;
}
const FB_LABELS = {};
function fbText() {
  return Object.entries(st.fb || {}).filter(([, v]) => v).map(([k, v]) => `[${FB_LABELS[k] || k}]\n${v}`).join("\n\n");
}
if (REVIEW) {
  const btn = document.getElementById("fb-btn"), pnl = document.getElementById("fb-panel"), txt = document.getElementById("fb-text");
  btn.addEventListener("click", () => {
    if (!pnl.hidden) { pnl.hidden = true; return; }
    document.getElementById("fb-title").textContent = "Feedback · " + fbLabel();
    txt.value = (st.fb || {})[fbKey()] || ""; pnl.hidden = false; txt.focus();
  });
  document.getElementById("fb-close").addEventListener("click", () => { pnl.hidden = true; });
  document.getElementById("fb-save").addEventListener("click", () => {
    st.fb = {...(st.fb || {}), [fbKey()]: txt.value.trim()}; FB_LABELS[fbKey()] = fbLabel();
    st.fbLabels = {...(st.fbLabels || {}), [fbKey()]: fbLabel()};
    save(); pnl.hidden = true; btn.classList.toggle("has", !!txt.value.trim());
  });
}
async function sendFeedback() {
  Object.assign(FB_LABELS, st.fbLabels || {});
  const body = {access_key: FORM_KEY, subject: `Feedback onboarding · ${ES_PATH[st.path] || ""} · ${st.a.name || "sin nombre"}`,
    from_name: BRAND, botcheck: "", "Ruta": ES_PATH[st.path] || "", "Feedback": fbText() || "(sin notas)"};
  const r = await fetch("https://api.web3forms.com/submit", {method: "POST", headers: {"Content-Type": "application/json", Accept: "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({})); if (!r.ok || !j.success) throw new Error(j.message || "send failed");
}

/* ---- Hand-off: translate to the ids coach/onboard.py reads ---- */
function payload() {
  const a = {...st.a}; const today = new Date().toISOString().slice(0, 10);
  const out = {_form: "team-coach-intake", v: 2, path: st.path, submitted: today, consent_date: today, language: st.lang};
  PARQ.forEach(([k]) => out[k] = a[k] === "yes" ? "yes" : "no");
  delete a.parq_none; PARQ.forEach(([k]) => delete a[k]);
  delete a.pilot_ease; delete a.pilot_confusing; delete a.pilot_join;
  if (a.max_weekend_min === "unknown") delete a.max_weekend_min;   // "No sé": the coach sets it on the call   // survey answers go in the email, not the profile
  if (st.path === "beginner") {
    const act = {none: ["no", "0"], walkrun: ["no", "5"], run30: ["yes", "8"]}[a.activity] || ["no", "0"];
    out.runs_continuous_30min = act[0]; out.km_week_3m = act[1];
    if (a.goal_choice === "race") out.goal_type = "race";
    else {
      out.goal_type = "fitness"; delete a.race_name; delete a.race_date; delete a.race_distance; delete a.race_type; delete a.race_type_other;
      if (a.goal_choice === "first5k") { out.race_distance = "5K"; out.success_3m = st.lang === "es" ? "Correr mis primeros 5 km sin parar" : "Run my first 5K non-stop"; }
    }
    if (a.session_time) out.max_weekday_min = out.max_weekend_min = a.session_time;
  } else {
    out.runs_continuous_30min = "yes";
    const label = (opts, v) => (v || "").split(", ").filter(Boolean).map(x => (opts.find(o => o[0] === x) || [x, {es: x}])[1].es).join(", ");
    const cq = S_WEEK_RUN.q.find(q => q.id === "commitments");
    const c = (a.commitments || "").split(", ");
    if (c.includes("shifts") || c.includes("night")) out.shift_work = "yes";
    out.commitments = [label(cq.opts, (a.commitments || "").split(", ").filter(x => x !== "other").join(", ")), a.commitments_other].filter(Boolean).join(", ");
    delete a.commitments; delete a.commitments_other;
    if (a.likes) { out.likes = label(TRAIN_TYPES, a.likes); delete a.likes; }
    if (a.dislikes) { out.dislikes = label(TRAIN_TYPES, a.dislikes); delete a.dislikes; }
    const tt = tripsText("es"); if (tt) out.travel = tt;
    if ((a.platforms || "").includes("garmin_connect")) out.garmin_connect = "yes";
    if (a.goal_type !== "race") { delete a.race_name; delete a.race_date; delete a.race_distance; delete a.target_time; delete a.race_type; delete a.race_type_other; }
  }
  delete a.trips; delete a.no_trips;
  if (!out.commitments) delete out.commitments;
  if (a.birth_date) {
    const b = new Date(a.birth_date + "T00:00:00"), n = new Date();
    out.age = String(n.getFullYear() - b.getFullYear() - ((n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) ? 1 : 0));
  }
  if (a.race_distance === "other") { out.race_distance = a.race_distance_other || "other"; }
  delete a.race_distance_other;
  if (a.watch_brand !== "garmin") { out.setup = "call"; delete a.setup; }
  if (a.setup !== "now") delete a.icu_athlete_id;
  if (a.watch_brand) {
    const names = {garmin:"Garmin",apple:"Apple Watch",coros:"COROS",suunto:"Suunto",polar:"Polar",other:"",none:"none"};
    out.watch_model = a.watch_brand === "none" ? "none" : [names[a.watch_brand], a.watch_model || ""].join(" ").trim() || "other";
    delete a.watch_model; if (a.watch_brand !== "garmin") delete a.garmin_connect;
  }
  for (const [k, v] of Object.entries(a)) if (v !== "" && v != null && !(k in out)) out[k] = v;
  return out;
}
function block() {   // machine block for the athlete-profile skill (email only)
  return "TEAM-COACH-INTAKE-START\n" + JSON.stringify(payload()) + "\nTEAM-COACH-INTAKE-END";
}
function message() {   // readable WhatsApp message, formatted like a form
  const lines = [`*${BRAND.toUpperCase()} · FICHA DE INSCRIPCIÓN*`, t(T.msgIntro), ""];
  groups().slice(1).forEach(([sec, rows]) => {
    lines.push(`*${sec.toUpperCase()}*`);
    rows.forEach(([l, v]) => lines.push(`• ${l.replace(/[¿?]/g, "")}: ${v}`));
    lines.push("");
  });
  lines.push(`_Ruta: ${ES_PATH[st.path]} · Enviado ${new Date().toISOString().slice(0, 10)}_`);
  return lines.join("\n");
}

if (st.done && st.sendState === "sending") st.sendState = "failed";   // interrupted send: offer retry, never resend silently
render();
</script>
